name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and publish tagged build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Verify tag matches application version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          app_version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          test -n "$app_version"
          test "v$app_version" = "$GITHUB_REF_NAME"
          grep -F "## [$app_version]" CHANGELOG.md
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run release verification
        run: >-
          ./gradlew
          lint
          typecheck
          test
          coverage
          build
          :app:lintRelease
          --no-daemon
          --stacktrace
      - name: Prepare checksummed release assets
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk "release-assets/pdf-maker-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/bundle/release/*.aab "release-assets/pdf-maker-${GITHUB_REF_NAME}-unsigned.aab"
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --generate-notes
          --title "PDF Maker $GITHUB_REF_NAME"
