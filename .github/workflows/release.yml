name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Verify and publish tagged build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Verify tag matches application version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          app_version=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts)
          test -n "$app_version"
          test "v$app_version" = "$GITHUB_REF_NAME"
      - name: Run release verification
        run: >-
          ./gradlew
          checkSourceFileSize
          :app:ktlintCheck
          :app:detekt
          :app:lintRelease
          :app:testDebugUnitTest
          :app:koverVerifyDebug
          :app:assembleDebug
          :app:bundleRelease
          --no-daemon
          --stacktrace
      - name: Prepare checksummed release assets
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk "release-assets/pdf-maker-${GITHUB_REF_NAME}-debug.apk"
          cp app/build/outputs/bundle/release/*.aab "release-assets/pdf-maker-${GITHUB_REF_NAME}-unsigned.aab"
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt
      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --generate-notes
          --title "PDF Maker $GITHUB_REF_NAME"
