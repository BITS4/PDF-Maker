name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-manifest:
    name: Export locked runtime graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Export release runtime dependencies
        run: ./gradlew writeRuntimeOsvManifest --no-daemon --stacktrace
      - name: Upload runtime manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-osv-manifest
          path: build/reports/dependency-audit/osv-scanner.json
          if-no-files-found: error
          retention-days: 1

  dependency-audit:
    name: OSV dependency audit
    needs: runtime-manifest
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.0
    with:
      download-artifact: runtime-osv-manifest
      fail-on-vuln: true
      results-file-name: osv-results.sarif
      runs-on: ubuntu-24.04
      scan-args: |-
        --lockfile=osv-scanner:osv-scanner.json
